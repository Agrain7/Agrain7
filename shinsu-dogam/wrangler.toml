# Cloudflare Pages 설정 (판매 빌드). 대시보드에서 프로젝트를 만든 뒤 아래 KV id 를 채운다.
# 시크릿(TOSS_SECRET_KEY, ADMIN_TOKEN)은 이 파일에 쓰지 말고 대시보드 > 설정 > 변수 및 Secret 에서 넣는다.
name = "shinsu-dogam"
pages_build_output_dir = "dist"
compatibility_date = "2026-11-01"

[[kv_namespaces]]
binding = "ORDERS"
id = "KV_NAMESPACE_ID_HERE"
