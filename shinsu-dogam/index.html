<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1d1a2b" />
    <meta name="description" content="신수도감(神獸圖鑑) — 영물을 타고, 동방의 세계를 누비다. 한국 전통 영물을 타고 탐험하는 2D 횡스크롤 라이딩 웹게임." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>신수도감 · DIVINE BEASTS ATLAS</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="신수도감 · DIVINE BEASTS ATLAS" />
    <meta property="og:description" content="영물을 타고, 동방의 세계를 누비다 — 한국 전통 영물 2D 횡스크롤 라이딩 게임" />
    <meta property="og:image" content="og.jpg" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="alternate icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23b8322a'/%3E%3Ctext x='32' y='45' font-size='34' text-anchor='middle' fill='%23f6e7c8' font-family='serif'%3E%E7%A5%9E%3C/text%3E%3C/svg%3E" />
    <style>
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background: #14121d; overflow: hidden;
        touch-action: none; -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      }
      #game { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      #game canvas { display: block; }
      #rotate {
        display: none; position: fixed; inset: 0; z-index: 10;
        background: #14121d; color: #f3e6c8; font-family: 'Gowun Dodum', sans-serif;
        align-items: center; justify-content: center; flex-direction: column; gap: 16px; text-align: center; padding: 24px;
      }
      #rotate .phone { width: 46px; height: 78px; border: 3px solid #e2b85c; border-radius: 9px; animation: rot 2.4s ease-in-out infinite; }
      @keyframes rot { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
      #boot-msg { position: fixed; bottom: 12px; width: 100%; text-align: center; color: #8a7f6a; font: 13px sans-serif; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">
      <div class="phone"></div>
      <div>화면을 가로로 돌려 주세요<br /><small>신수도감은 가로 화면에 맞춰 제작되었습니다.</small></div>
    </div>
    <noscript><div id="boot-msg">이 게임을 플레이하려면 JavaScript를 켜 주세요.</div></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
